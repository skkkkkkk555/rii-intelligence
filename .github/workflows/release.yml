name: release
on:
  push:
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(sed -n 1p VERSION); SHA=$(sed -n 2p VERSION)
          F=RiiIntelligence-$VER-win-x64.zip
          cat parts/$F.part* > $F
          echo "$SHA  $F" | sha256sum -c -
          if gh release view $VER >/dev/null 2>&1; then
            gh release upload $VER $F --clobber
          else
            gh release create $VER $F --title "Rii Intelligence $VER（体験版）" --notes-file RELEASE_NOTES_$VER.md --latest
          fi
